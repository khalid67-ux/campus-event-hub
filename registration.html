<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration | Campus Event Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="index.html" class="logo">
            Campus <span>Hub</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="my-registration.html">
                My Registration
            </a>
        </nav>

    </div>

</header>


<main>

<section class="section">

<div class="container">

    <div class="form-wrapper">

        <div class="section-heading">

            <span>Registration</span>

            <h1 id="registrationTitle">
                Register for Event
            </h1>

        </div>


        <form id="registrationForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <small id="nameError"></small>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <small id="emailError"></small>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="01XXXXXXXXX"
                    required
                >

                <small id="phoneError"></small>

            </div>


            <button
                type="submit"
                id="registerButton"
                class="btn primary-btn"
            >
                Submit Registration
            </button>

            <div
                id="successMessage"
                class="success-message"
            ></div>

        </form>

    </div>

</div>

</section>

</main>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 Campus Event Hub.
        </p>

    </div>

</footer>


<script src="js/data.js"></script>
<script src="js/registration.js"></script>

</body>

</html>
